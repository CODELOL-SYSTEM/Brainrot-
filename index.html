```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Brainrot Roll</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

body{
  overflow:hidden;
  background:#030303;
  color:white;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  background:#050505;
}

/* FAUSSE 3D FPS */

#world{
  position:absolute;
  inset:0;
  perspective:900px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,#252525 0%,#0b0b0b 42%,#020202 100%);
}

.floor{
  position:absolute;
  width:300%;
  height:180%;
  left:-100%;
  top:48%;
  transform:
    perspective(600px)
    rotateX(63deg);
  background:
    linear-gradient(#ff720015 2px,transparent 2px),
    linear-gradient(90deg,#ff720015 2px,transparent 2px);
  background-size:80px 80px;
  transform-origin:center top;
}

.ceiling{
  position:absolute;
  width:300%;
  height:100%;
  left:-100%;
  top:-90%;
  transform:rotateX(-63deg);
  background:
    linear-gradient(#ffffff08 2px,transparent 2px),
    linear-gradient(90deg,#ffffff08 2px,transparent 2px);
  background-size:80px 80px;
}

.backWall{
  position:absolute;
  width:90%;
  height:48%;
  left:5%;
  top:18%;
  background:
    linear-gradient(90deg,#111,#222,#111);
  border:2px solid #292929;
  box-shadow:0 0 100px #ff6f0015 inset;
}

.neon{
  position:absolute;
  width:65%;
  height:4px;
  left:17.5%;
  top:28%;
  background:#ff7200;
  box-shadow:0 0 30px #ff7200;
}

/* ROUE */

.station{
  position:absolute;
  left:50%;
  top:51%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.stationTitle{
  font-size:13px;
  letter-spacing:4px;
  color:#999;
  margin-bottom:15px;
}

.wheelWrap{
  position:relative;
  width:310px;
  height:310px;
}

.wheel{
  width:310px;
  height:310px;
  border-radius:50%;
  border:9px solid #292929;

  background:conic-gradient(
    #ff7200 0deg 30deg,
    #111 30deg 60deg,
    #ff9d3c 60deg 90deg,
    #111 90deg 120deg,
    #c951ff 120deg 150deg,
    #111 150deg 180deg,
    #ff7200 180deg 210deg,
    #111 210deg 240deg,
    #ff4040 240deg 270deg,
    #111 270deg 300deg,
    #ffd000 300deg 330deg,
    #111 330deg 360deg
  );

  box-shadow:
    0 0 40px #ff720033,
    inset 0 0 45px #000;

  transition:
    transform 4s cubic-bezier(.08,.75,.12,1);
}

.wheelCenter{
  position:absolute;
  width:80px;
  height:80px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#090909;
  border:3px solid #ff7200;
  border-radius:50%;
  box-shadow:0 0 30px #ff7200;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  z-index:4;
}

.pointer{
  position:absolute;
  z-index:5;
  left:50%;
  top:-19px;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:34px solid white;
  filter:drop-shadow(0 0 8px #ff7200);
}

.roll{
  margin-top:22px;
  width:220px;
  height:52px;
  border:0;
  border-radius:12px;
  background:#ff7200;
  color:#050505;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 30px #ff720044;
}

.roll:hover{
  background:#ff9438;
  transform:scale(1.04);
}

.roll:disabled{
  opacity:.4;
}

/* HUD */

.hud{
  position:absolute;
  z-index:10;
  top:20px;
  left:20px;
  display:flex;
  gap:10px;
}

.box{
  background:#0c0c0cee;
  border:1px solid #292929;
  border-radius:12px;
  padding:11px 16px;
}

.label{
  color:#666;
  font-size:10px;
  text-transform:uppercase;
}

.value{
  color:#ff7200;
  font-weight:bold;
  font-size:19px;
  margin-top:3px;
}

.menu{
  position:absolute;
  z-index:10;
  right:20px;
  top:20px;
}

.menu button{
  background:#111;
  color:white;
  border:1px solid #292929;
  padding:13px 18px;
  border-radius:11px;
  cursor:pointer;
  font-weight:bold;
}

.menu button:hover{
  background:#ff7200;
  color:#000;
}

/* RESULT */

#result{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  background:#090909f5;
  border:1px solid #333;
  border-radius:14px;
  padding:16px 30px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

#result.show{
  opacity:1;
}

.resultName{
  font-size:22px;
  font-weight:bold;
}

.resultRarity{
  font-size:11px;
  margin-top:5px;
  letter-spacing:2px;
}

/* INVENTAIRE */

#inventoryPanel{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:#000c;
  backdrop-filter:blur(15px);
}

.inventory{
  position:absolute;
  width:900px;
  max-width:92%;
  height:680px;
  max-height:88%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#090909;
  border:1px solid #292929;
  border-radius:20px;
  padding:25px;
}

.invHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.invHead h2{
  font-size:25px;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#151515;
  color:white;
  cursor:pointer;
}

.close:hover{
  background:#ff7200;
  color:#000;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  height:560px;
  overflow-y:auto;
}

.item{
  position:relative;
  height:155px;
  background:#111;
  border:1px solid #282828;
  border-radius:15px;
  padding:14px;
}

.itemIcon{
  text-align:center;
  font-size:48px;
  margin-bottom:7px;
}

.itemName{
  font-size:13px;
  font-weight:bold;
}

.itemRarity{
  font-size:10px;
  margin-top:4px;
  text-transform:uppercase;
}

.itemValue{
  position:absolute;
  right:10px;
  bottom:10px;
  color:#ff7200;
  font-size:10px;
}

/* RARETÉS */

.common{
  color:#aaa;
}

.rare{
  color:#35aaff;
}

.epic{
  color:#bd55ff;
}

.legendary{
  color:#ff9d00;
}

.mythic{
  color:#ff3838;
}

.secret{
  color:#ffdd00;
  text-shadow:0 0 10px #ff8c00;
}

/* CROSSHAIR */

.crosshair{
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  width:16px;
  height:16px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.crosshair:before,
.crosshair:after{
  content:"";
  position:absolute;
  background:#ffffffaa;
}

.crosshair:before{
  width:16px;
  height:2px;
  top:7px;
  left:0;
}

.crosshair:after{
  width:2px;
  height:16px;
  left:7px;
  top:0;
}

.controls{
  position:absolute;
  z-index:10;
  left:20px;
  bottom:20px;
  color:#666;
  font-size:12px;
}

kbd{
  background:#151515;
  border:1px solid #303030;
  color:#aaa;
  border-radius:5px;
  padding:4px 7px;
}

/* MOBILE */

@media(max-width:700px){

  .wheel,
  .wheelWrap{
    width:230px;
    height:230px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hud{
    transform:scale(.8);
    transform-origin:top left;
  }

}
</style>
</head>

<body>

<div id="game">

  <div id="world">
    <div class="ceiling"></div>
    <div class="floor"></div>
    <div class="backWall"></div>
    <div class="neon"></div>

    <div class="station">

      <div class="stationTitle">
        BRAINROT ROLL
      </div>

      <div class="wheelWrap">

        <div class="pointer"></div>

        <div class="wheel" id="wheel">
          <div class="wheelCenter">
            🧠
          </div>
        </div>

      </div>

      <button class="roll" id="rollButton" onclick="roll()">
        ROLL • 500 🟠
      </button>

    </div>
  </div>


  <!-- HUD -->

  <div class="hud">

    <div class="box">
      <div class="label">Coins</div>
      <div class="value" id="coins">🟠 10,000</div>
    </div>

    <div class="box">
      <div class="label">Brainrots</div>
      <div class="value" id="amount">0</div>
    </div>

  </div>


  <!-- MENU -->

  <div class="menu">
    <button onclick="openInventory()">
      🎒 INVENTORY
    </button>
  </div>


  <div class="crosshair"></div>

  <div class="controls">
    <kbd>Z</kbd>
    <kbd>Q</kbd>
    <kbd>S</kbd>
    <kbd>D</kbd>
    déplacer
    &nbsp;&nbsp;
    souris = regarder
  </div>


  <div id="result">
    <div class="resultName" id="resultName"></div>
    <div class="resultRarity" id="resultRarity"></div>
  </div>

</div>


<!-- INVENTORY -->

<div id="inventoryPanel">

  <div class="inventory">

    <div class="invHead">
      <h2>🎒 INVENTORY</h2>
      <button class="close" onclick="closeInventory()">✕</button>
    </div>

    <div class="grid" id="inventoryGrid"></div>

  </div>

</div>


<script>

/* ==============================
   BRAINROTS
============================== */

const brainrots = [

  {
    name:"Noobini Pizzanini",
    icon:"🍕",
    rarity:"common",
    chance:35,
    value:100
  },

  {
    name:"Tralalero Shark",
    icon:"🦈",
    rarity:"common",
    chance:22,
    value:250
  },

  {
    name:"Brr Brr Patapim",
    icon:"🌳",
    rarity:"rare",
    chance:15,
    value:600
  },

  {
    name:"Bombardiro Crocodilo",
    icon:"🐊",
    rarity:"rare",
    chance:10,
    value:1200
  },

  {
    name:"Tung Tung Sahur",
    icon:"🥁",
    rarity:"epic",
    chance:7,
    value:3000
  },

  {
    name:"Cappuccino Assassin",
    icon:"☕",
    rarity:"epic",
    chance:5,
    value:6000
  },

  {
    name:"Garama Dragon",
    icon:"🐉",
    rarity:"legendary",
    chance:3,
    value:15000
  },

  {
    name:"Dragon Cannelloni",
    icon:"🐲",
    rarity:"legendary",
    chance:1.8,
    value:30000
  },

  {
    name:"Celestial Garama",
    icon:"🌌",
    rarity:"mythic",
    chance:0.7,
    value:100000
  },

  {
    name:"OMEGA BRAINROT",
    icon:"👑",
    rarity:"secret",
    chance:.5,
    value:500000
  }

];


/* ==============================
   GAME
============================== */

let coins = 10000;
let inventory = [];
let rolling = false;


/* ==============================
   COINS
============================== */

function updateHUD(){

  document.getElementById("coins").textContent =
    "🟠 " + coins.toLocaleString("fr-FR");

  document.getElementById("amount").textContent =
    inventory.length;

}


/* ==============================
   RANDOM
============================== */

function getRandomBrainrot(){

  const random = Math.random() * 100;

  let total = 0;

  for(const brainrot of brainrots){

    total += brainrot.chance;

    if(random <= total){
      return brainrot;
    }

  }

  return brainrots[0];
}


/* ==============================
   ROLL
============================== */

function roll(){

  if(rolling) return;

  if(coins < 500){

    showResult(
      "Pas assez de coins",
      "common"
    );

    return;

  }

  rolling = true;

  coins -= 500;

  updateHUD();

  document.getElementById("rollButton").disabled = true;

  const wheel =
    document.getElementById("wheel");

  const rotation =
    1800 + Math.floor(Math.random()*1800);

  wheel.style.transform =
    `rotate(${rotation}deg)`;


  setTimeout(()=>{

    const brainrot =
      getRandomBrainrot();

    inventory.push(brainrot);

    updateHUD();

    renderInventory();

    showResult(
      brainrot.icon+" "+brainrot.name,
      brainrot.rarity
    );

    rolling=false;

    document.getElementById(
      "rollButton"
    ).disabled=false;

  },4000);

}


/* ==============================
   RESULT
============================== */

function showResult(name,rarity){

  const result =
    document.getElementById("result");

  document.getElementById(
    "resultName"
  ).textContent=name;

  document.getElementById(
    "resultRarity"
  ).textContent=
    rarity.toUpperCase();

  document.getElementById(
    "resultRarity"
  ).className=
    "resultRarity "+rarity;

  result.classList.add("show");

  setTimeout(()=>{

    result.classList.remove("show");

  },4000);

}


/* ==============================
   INVENTORY
============================== */

function openInventory(){

  renderInventory();

  document.getElementById(
    "inventoryPanel"
  ).style.display="block";

}


function closeInventory(){

  document.getElementById(
    "inventoryPanel"
  ).style.display="none";

}


function renderInventory(){

  const grid =
    document.getElementById(
      "inventoryGrid"
    );

  grid.innerHTML="";

  if(inventory.length===0){

    grid.innerHTML=
      "<div style='color:#555'>Aucun brainrot</div>";

    return;

  }

  inventory.forEach(item=>{

    const card =
      document.createElement("div");

    card.className="item";

    card.innerHTML=`

      <div class="itemIcon">
        ${item.icon}
      </div>

      <div class="itemName">
        ${item.name}
      </div>

      <div class="itemRarity ${item.rarity}">
        ${item.rarity}
      </div>

      <div class="itemValue">
        ${item.value.toLocaleString("fr-FR")} 🟠
      </div>

    `;

    grid.appendChild(card);

  });

}


/* ==============================
   FPS MOVEMENT
============================== */

const world =
  document.getElementById("world");

const keys={};

let posX=0;
let posZ=0;

let cameraX=0;
let cameraY=0;

document.addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;
  }
);

document.addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);


/* souris */

document.addEventListener(
  "mousemove",
  e=>{

    if(document.pointerLockElement){

      cameraX += e.movementX * .08;
      cameraY += e.movementY * .05;

      cameraY =
        Math.max(
          -20,
          Math.min(20,cameraY)
        );

      world.style.transform =
        `rotateY(${-cameraX}deg)
         rotateX(${cameraY}deg)`;

    }

  }
);


/* clic pour capturer souris */

document.addEventListener(
  "click",
  e=>{

    if(
      e.target.tagName !== "BUTTON" &&
      document.getElementById(
        "inventoryPanel"
      ).style.display !== "block"
    ){

      document.body.requestPointerLock();

    }

  }
);


/* mouvement réel */

function updateMovement(){

  let forward=0;
  let sideways=0;

  if(keys["z"]) forward += 1;
  if(keys["s"]) forward -= 1;

  if(keys["q"]) sideways -= 1;
  if(keys["d"]) sideways += 1;

  const speed=.13;

  const angle =
    cameraX * Math.PI / 180;

  posX +=
    (
      sideways*Math.cos(angle)
      -
      forward*Math.sin(angle)
    ) * speed;

  posZ +=
    (
      sideways*Math.sin(angle)
      +
      forward*Math.cos(angle)
    ) * speed;


  /*
    déplacement de la caméra
    donc le monde bouge à l'inverse
  */

  world.style.left =
    (-posX*80)+"px";

  world.style.top =
    (-posZ*80)+"px";

  requestAnimationFrame(
    updateMovement
  );

}

updateMovement();

updateHUD();

renderInventory();

</script>

</body>
</html>
