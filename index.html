<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BRAINROT EMPIRE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

body{
  overflow:hidden;
  background:#050505;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
}

/* WORLD */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at center,#252525 0%,#0d0d0d 42%,#030303 100%);
}

.floor{
  position:absolute;
  width:3000px;
  height:3000px;
  left:-1500px;
  top:-1500px;

  background:
    linear-gradient(#ff720012 2px,transparent 2px),
    linear-gradient(90deg,#ff720012 2px,transparent 2px);

  background-size:80px 80px;
}

/* DECOR */

.wall{
  position:absolute;
  width:700px;
  height:250px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#111;
  border:2px solid #292929;
  box-shadow:0 0 80px #000;
}

.neonLine{
  position:absolute;
  width:620px;
  height:4px;
  left:50%;
  top:calc(50% - 100px);
  transform:translateX(-50%);
  background:#ff7200;
  box-shadow:0 0 25px #ff7200;
}

/* PLAYER */

#player{
  position:absolute;
  width:26px;
  height:26px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:10;
}

.playerBody{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#ff7200;
  border:3px solid white;
  box-shadow:0 0 25px #ff7200;
}

/* STATIONS */

.station{
  position:absolute;
  width:150px;
  height:150px;
  background:#101010;
  border:2px solid #292929;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  box-shadow:0 0 30px #000;
}

.stationIcon{
  font-size:48px;
}

.stationName{
  color:#aaa;
  font-size:12px;
  margin-top:7px;
}

/* HUD */

.hud{
  position:fixed;
  z-index:100;
  left:20px;
  top:20px;
  display:flex;
  gap:10px;
}

.hudBox{
  background:#0b0b0bee;
  border:1px solid #292929;
  border-radius:12px;
  padding:11px 16px;
  min-width:125px;
}

.label{
  color:#666;
  font-size:10px;
  text-transform:uppercase;
}

.value{
  color:#ff7200;
  font-size:18px;
  font-weight:bold;
  margin-top:3px;
}

/* MENU */

.menu{
  position:fixed;
  right:20px;
  top:20px;
  z-index:100;
  display:flex;
  gap:8px;
}

.menu button{
  background:#111;
  color:white;
  border:1px solid #292929;
  border-radius:10px;
  padding:12px 15px;
  font-weight:bold;
}

.menu button:hover{
  background:#ff7200;
  color:#000;
}

/* POPUP */

.popup{
  position:fixed;
  z-index:500;
  inset:0;
  background:#000c;
  backdrop-filter:blur(10px);
  display:none;
}

.panel{
  position:absolute;
  width:950px;
  max-width:94%;
  height:720px;
  max-height:88vh;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#090909;
  border:1px solid #292929;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 100px #000;
}

.panelHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.panelHead h2{
  font-size:25px;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#151515;
  color:white;
  font-size:18px;
}

.close:hover{
  background:#ff7200;
  color:#000;
}

/* INVENTORY */

.grid{
  height:590px;
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.card{
  position:relative;
  min-height:150px;
  background:#111;
  border:1px solid #282828;
  border-radius:15px;
  padding:12px;
  transition:.2s;
}

.card:hover{
  border-color:#ff7200;
  transform:translateY(-3px);
}

.cardIcon{
  height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:38px;
}

.cardName{
  font-size:12px;
  font-weight:bold;
}

.cardRarity{
  font-size:9px;
  margin-top:4px;
  text-transform:uppercase;
}

.cardValue{
  color:#ff7200;
  font-size:10px;
  margin-top:8px;
}

.sellButton{
  position:absolute;
  bottom:10px;
  right:10px;
  border:0;
  background:#191919;
  color:#aaa;
  border-radius:7px;
  padding:5px 7px;
  font-size:9px;
}

.sellButton:hover{
  background:#ff7200;
  color:#000;
}

/* MACHINES */

.machineList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  height:590px;
  overflow-y:auto;
}

.machine{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
}

.machineTop{
  display:flex;
  gap:15px;
  align-items:center;
}

.machineIcon{
  font-size:45px;
}

.machineTitle{
  font-weight:bold;
  font-size:16px;
}

.machineLevel{
  color:#777;
  font-size:11px;
  margin-top:4px;
}

.machineIncome{
  color:#ff7200;
  font-size:13px;
  margin-top:15px;
}

.upgrade{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#ff7200;
  color:#050505;
  font-weight:bold;
}

.upgrade:hover{
  background:#ff963f;
}

/* SHOP */

.shopGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.shopItem{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
}

.shopItem h3{
  font-size:15px;
}

.shopItem p{
  color:#777;
  font-size:11px;
  margin-top:8px;
}

.shopItem button{
  width:100%;
  margin-top:15px;
  padding:10px;
  background:#ff7200;
  color:#000;
  border:0;
  border-radius:9px;
  font-weight:bold;
}

/* NOTIFY */

#notify{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#0b0b0b;
  border:1px solid #292929;
  border-radius:12px;
  padding:13px 25px;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#notify.show{
  opacity:1;
}

/* RARITIES */

.common{color:#aaa}
.uncommon{color:#55dd77}
.rare{color:#36a9ff}
.epic{color:#b650ff}
.legendary{color:#ff9c00}
.mythic{color:#ff3838}
.godly{
  color:#ffe000;
  text-shadow:0 0 10px #ff7200;
}
.secret{
  color:#fff;
  text-shadow:0 0 12px #fff;
}

/* CONTROLS */

.controls{
  position:fixed;
  left:20px;
  bottom:20px;
  color:#555;
  z-index:100;
  font-size:12px;
}

kbd{
  background:#151515;
  border:1px solid #292929;
  padding:4px 7px;
  border-radius:5px;
  color:#aaa;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .machineList{
    grid-template-columns:1fr;
  }

  .shopGrid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="floor" id="floor"></div>

  <div class="wall"></div>
  <div class="neonLine"></div>

  <div class="station" style="left:calc(50% - 400px);top:calc(50% - 180px)">
    <div class="stationIcon">🎰</div>
    <div class="stationName">ROLL MACHINE</div>
  </div>

  <div class="station" style="left:calc(50% + 250px);top:calc(50% - 180px)">
    <div class="stationIcon">🏭</div>
    <div class="stationName">MACHINES</div>
  </div>

  <div class="station" style="left:calc(50% - 400px);top:calc(50% + 80px)">
    <div class="stationIcon">💰</div>
    <div class="stationName">SELL</div>
  </div>

  <div class="station" style="left:calc(50% + 250px);top:calc(50% + 80px)">
    <div class="stationIcon">🛒</div>
    <div class="stationName">SHOP</div>
  </div>

  <div id="player">
    <div class="playerBody"></div>
  </div>

</div>


<!-- HUD -->

<div class="hud">

  <div class="hudBox">
    <div class="label">Coins</div>
    <div class="value" id="coins">🟠 10,000</div>
  </div>

  <div class="hudBox">
    <div class="label">/ seconde</div>
    <div class="value" id="income">🟠 0</div>
  </div>

  <div class="hudBox">
    <div class="label">Brainrots</div>
    <div class="value" id="count">0</div>
  </div>

</div>


<!-- MENU -->

<div class="menu">

  <button onclick="openPanel('inventory')">
    🎒 Inventaire
  </button>

  <button onclick="openPanel('machines')">
    🏭 Machines
  </button>

  <button onclick="openPanel('shop')">
    🛒 Shop
  </button>

</div>


<div class="controls">
  <kbd>Z</kbd>
  <kbd>Q</kbd>
  <kbd>S</kbd>
  <kbd>D</kbd>
  déplacer
</div>


<!-- NOTIFICATION -->

<div id="notify"></div>


<!-- INVENTORY -->

<div class="popup" id="inventory">

  <div class="panel">

    <div class="panelHead">
      <h2>🎒 INVENTAIRE</h2>
      <button class="close" onclick="closePanels()">✕</button>
    </div>

    <div class="grid" id="inventoryGrid"></div>

  </div>

</div>


<!-- MACHINES -->

<div class="popup" id="machines">

  <div class="panel">

    <div class="panelHead">
      <h2>🏭 MACHINES</h2>
      <button class="close" onclick="closePanels()">✕</button>
    </div>

    <div class="machineList" id="machineList"></div>

  </div>

</div>


<!-- SHOP -->

<div class="popup" id="shop">

  <div class="panel">

    <div class="panelHead">
      <h2>🛒 SHOP</h2>
      <button class="close" onclick="closePanels()">✕</button>
    </div>

    <div class="shopGrid" id="shopGrid"></div>

  </div>

</div>


<script>

/* ==========================================
   400 BRAINROTS
========================================== */

const prefixes=[
  "Garama",
  "Trala",
  "Tung",
  "Brr",
  "Bombardiro",
  "Cappuccino",
  "Brain",
  "Sigma",
  "Omega",
  "Turbo",
  "Galaxy",
  "Cosmo",
  "Inferno",
  "Shadow",
  "Golden",
  "Diamond",
  "Atomic",
  "Ultra",
  "Mega",
  "Royal"
];

const middles=[
  "Dragon",
  "Crocodilo",
  "Pizzanini",
  "Patapim",
  "Sahur",
  "Assassino",
  "Raptor",
  "Titan",
  "Monkey",
  "Ballerina",
  "Shark",
  "Banana",
  "Wizard",
  "Robot",
  "Cow",
  "Toilet",
  "Penguin",
  "Goober",
  "Golem",
  "Knight"
];

const suffixes=[
  "Classic",
  "Prime",
  "Turbo",
  "Max",
  "X",
  "Ultra",
  "Supreme",
  "Cosmic",
  "Ancient",
  "Eternal"
];

const rarities=[
  {
    name:"common",
    chance:45,
    value:100
  },
  {
    name:"uncommon",
    chance:25,
    value:250
  },
  {
    name:"rare",
    chance:15,
    value:800
  },
  {
    name:"epic",
    chance:8,
    value:2500
  },
  {
    name:"legendary",
    chance:4,
    value:9000
  },
  {
    name:"mythic",
    chance:2,
    value:30000
  },
  {
    name:"godly",
    chance:.8,
    value:100000
  },
  {
    name:"secret",
    chance:.2,
    value:500000
  }
];

const icons=[
  "🐉","🐊","🦈","🍕","🥁","☕","🐒","🐄",
  "🤖","👑","🌌","🔥","💎","⚡","🧠","👽",
  "🦖","🐸","🦆","🐧"
];

let brainrots=[];


/* création des 400 */

let index=0;

for(let p=0;p<prefixes.length;p++){

  for(let m=0;m<middles.length;m++){

    let rarityIndex=
      Math.floor(index/50);

    if(rarityIndex>7)
      rarityIndex=7;

    brainrots.push({

      id:index,

      name:
        prefixes[p]+" "+
        middles[m]+" "+
        suffixes[
          index % suffixes.length
        ],

      icon:
        icons[
          index % icons.length
        ],

      rarity:
        rarities[rarityIndex].name,

      value:
        rarities[rarityIndex].value *
        (1 + ((index%10)*.1)),

      chance:
        rarities[rarityIndex].chance

    });

    index++;

  }

}


/* ==========================================
   GAME VARIABLES
========================================== */

let coins=10000;

let inventory=[];

let incomePerSecond=0;

let playerX=0;
let playerY=0;

const keys={};


/* ==========================================
   MACHINES
========================================== */

const machines=[

  {
    name:"Coin Generator",
    icon:"🟠",
    level:0,
    base:5,
    cost:500
  },

  {
    name:"Brainrot Printer",
    icon:"🖨️",
    level:0,
    base:15,
    cost:1500
  },

  {
    name:"Golden Reactor",
    icon:"⚛️",
    level:0,
    base:50,
    cost:5000
  },

  {
    name:"Dragon Engine",
    icon:"🐉",
    level:0,
    base:150,
    cost:15000
  },

  {
    name:"Cosmic Core",
    icon:"🌌",
    level:0,
    base:500,
    cost:50000
  },

  {
    name:"Brainrot Factory",
    icon:"🏭",
    level:0,
    base:1500,
    cost:150000
  },

  {
    name:"Omega Reactor",
    icon:"☢️",
    level:0,
    base:5000,
    cost:500000
  },

  {
    name:"Garama Engine",
    icon:"🐲",
    level:0,
    base:15000,
    cost:1500000
  }

];


/* ==========================================
   10 WAYS TO GET COINS
========================================== */

const ways=[

  "Machines",

  "Vendre un brainrot",

  "Bonus de connexion",

  "Objectifs",

  "Quêtes",

  "Succès",

  "Combo de rolls",

  "Brainrot collection",

  "Bonus de niveau",

  "Événements du jeu"

];


/* ==========================================
   HUD
========================================== */

function updateHUD(){

  document.getElementById("coins")
    .textContent=
    "🟠 "+Math.floor(coins)
      .toLocaleString("fr-FR");

  document.getElementById("income")
    .textContent=
    "🟠 "+Math.floor(incomePerSecond)
      .toLocaleString("fr-FR");

  document.getElementById("count")
    .textContent=inventory.length;

}


/* ==========================================
   MACHINE INCOME
========================================== */

function calculateIncome(){

  incomePerSecond=0;

  machines.forEach(machine=>{

    incomePerSecond +=
      machine.level *
      machine.base;

  });

}


/* ==========================================
   MONEY LOOP
========================================== */

setInterval(()=>{

  calculateIncome();

  coins += incomePerSecond;

  updateHUD();

},1000);


/* ==========================================
   RANDOM BRAINROT
========================================== */

function randomBrainrot(){

  let total=0;

  for(const rarity of rarities)
    total+=rarity.chance;

  let random=
    Math.random()*total;

  let selectedRarity;

  for(const rarity of rarities){

    random-=rarity.chance;

    if(random<=0){

      selectedRarity=
        rarity.name;

      break;

    }

  }

  const possible=
    brainrots.filter(
      b=>b.rarity===selectedRarity
    );

  return possible[
    Math.floor(
      Math.random()*possible.length
    )
  ];

}


/* ==========================================
   ROLL
========================================== */

function rollBrainrot(){

  const cost=500;

  if(coins<cost){

    notify("Pas assez de coins");

    return;

  }

  coins-=cost;

  const item=randomBrainrot();

  inventory.push(item);

  updateHUD();

  renderInventory();

  notify(
    "🎉 "+item.name+
    " • "+item.rarity
  );

}


/* ==========================================
   SELL
========================================== */

function sellBrainrot(index){

  const item=inventory[index];

  if(!item) return;

  coins+=item.value;

  inventory.splice(index,1);

  updateHUD();

  renderInventory();

  notify(
    "+"+Math.floor(item.value)
    +" 🟠"
  );

}


function sellEverything(){

  if(inventory.length===0){

    notify("Inventaire vide");

    return;

  }

  let total=0;

  inventory.forEach(
    item=>total+=item.value
  );

  inventory=[];

  coins+=total;

  updateHUD();

  renderInventory();

  notify(
    "Vendu pour "+
    Math.floor(total)
    +" 🟠"
  );

}


/* ==========================================
   INVENTORY
========================================== */

function renderInventory(){

  const grid=
    document.getElementById(
      "inventoryGrid"
    );

  grid.innerHTML="";

  if(inventory.length===0){

    grid.innerHTML=
      "<div style='color:#555'>Aucun brainrot</div>";

    return;

  }

  inventory.forEach((item,i)=>{

    const card=
      document.createElement("div");

    card.className="card";

    card.innerHTML=`

      <div class="cardIcon">
        ${item.icon}
      </div>

      <div class="cardName">
        ${item.name}
      </div>

      <div class="cardRarity ${item.rarity}">
        ${item.rarity}
      </div>

      <div class="cardValue">
        ${Math.floor(item.value)
          .toLocaleString("fr-FR")} 🟠
      </div>

      <button
        class="sellButton"
        onclick="sellBrainrot(${i})">
        VENDRE
      </button>

    `;

    grid.appendChild(card);

  });

}


/* ==========================================
   MACHINES UI
========================================== */

function renderMachines(){

  const list=
    document.getElementById(
      "machineList"
    );

  list.innerHTML="";

  machines.forEach((machine,i)=>{

    const cost=
      Math.floor(
        machine.cost *
        Math.pow(1.65,machine.level)
      );

    const income=
      machine.base *
      machine.level;

    const div=
      document.createElement("div");

    div.className="machine";

    div.innerHTML=`

      <div class="machineTop">

        <div class="machineIcon">
          ${machine.icon}
        </div>

        <div>

          <div class="machineTitle">
            ${machine.name}
          </div>

          <div class="machineLevel">
            Niveau ${machine.level}
          </div>

        </div>

      </div>

      <div class="machineIncome">
        +${income.toLocaleString("fr-FR")} 🟠 / seconde
      </div>

      <button
        class="upgrade"
        onclick="upgradeMachine(${i})">

        AMÉLIORER •
        ${cost.toLocaleString("fr-FR")} 🟠

      </button>

    `;

    list.appendChild(div);

  });

}


/* ==========================================
   UPGRADE
========================================== */

function upgradeMachine(i){

  const machine=machines[i];

  const cost=
    Math.floor(
      machine.cost*
      Math.pow(1.65,machine.level)
    );

  if(coins<cost){

    notify("Pas assez de coins");

    return;

  }

  coins-=cost;

  machine.level++;

  calculateIncome();

  updateHUD();

  renderMachines();

  notify(
    machine.name+
    " niveau "+
    machine.level
  );

}


/* ==========================================
   SHOP
========================================== */

function renderShop(){

  const shop=
    document.getElementById(
      "shopGrid"
    );

  shop.innerHTML="";

  const items=[

    {
      name:"Roll",
      icon:"🎰",
      description:"Lance la roue et obtient un brainrot",
      price:500,
      action:"rollBrainrot()"
    },

    {
      name:"Pack Coin",
      icon:"🟠",
      description:"Ajoute 5 000 coins virtuels",
      price:0,
      action:"addCoins(5000)"
    },

    {
      name:"Boost",
      icon:"⚡",
      description:"Bonus temporaire de revenus",
      price:10000,
      action:"boostIncome()"
    },

    {
      name:"Mega Roll",
      icon:"🔥",
      description:"Roll spécial plus cher",
      price:2500,
      action:"megaRoll()"
    },

    {
      name:"Collection Bonus",
      icon:"📚",
      description:"Bonus basé sur tes collections",
      price:5000,
      action:"collectionBonus()"
    },

    {
      name:"Event",
      icon:"🌌",
      description:"Déclenche un événement virtuel",
      price:15000,
      action:"eventBonus()"
    }

  ];

  items.forEach(item=>{

    const div=
      document.createElement("div");

    div.className="shopItem";

    div.innerHTML=`

      <h3>
        ${item.icon} ${item.name}
      </h3>

      <p>
        ${item.description}
      </p>

      <button
        onclick="${item.action}">

        ${item.price===0
          ?"OBTENIR"
          :item.price.toLocaleString("fr-FR")
          +" 🟠"}

      </button>

    `;

    shop.appendChild(div);

  });

}


/* ==========================================
   BONUS SYSTEMS
========================================== */

function addCoins(amount){

  coins+=amount;

  updateHUD();

  notify(
    "+"+amount.toLocaleString("fr-FR")
    +" 🟠"
  );

}


function boostIncome(){

  const price=10000;

  if(coins<price){

    notify("Pas assez de coins");

    return;

  }

  coins-=price;

  incomePerSecond*=2;

  updateHUD();

  notify("Revenus x2 pendant 30 secondes");

  setTimeout(()=>{

    calculateIncome();

    updateHUD();

    notify("Boost terminé");

  },30000);

}


function megaRoll(){

  const price=2500;

  if(coins<price){

    notify("Pas assez de coins");

    return;

  }

  coins-=price;

  const item=randomBrainrot();

  item.value*=5;

  inventory.push(item);

  updateHUD();

  renderInventory();

  notify(
    "🔥 MEGA ROLL : "+
    item.name
  );

}


function collectionBonus(){

  const price=5000;

  if(coins<price){

    notify("Pas assez de coins");

    return;

  }

  coins-=price;

  const bonus=
    inventory.length*100;

  coins+=bonus;

  updateHUD();

  notify(
    "+"+bonus+" 🟠 collection"
  );

}


function eventBonus(){

  const price=15000;

  if(coins<price){

    notify("Pas assez de coins");

    return;

  }

  coins-=price;

  const bonus=
    Math.floor(
      5000+
      Math.random()*45000
    );

  coins+=bonus;

  updateHUD();

  notify(
    "🌌 Event +"+
    bonus.toLocaleString("fr-FR")
    +" 🟠"
  );

}


/* ==========================================
   PANELS
========================================== */

function openPanel(name){

  closePanels();

  document.getElementById(name)
    .style.display="block";

  if(name==="inventory")
    renderInventory();

  if(name==="machines")
    renderMachines();

  if(name==="shop")
    renderShop();

}


function closePanels(){

  document
    .querySelectorAll(".popup")
    .forEach(
      p=>p.style.display="none"
    );

}


/* ==========================================
   NOTIFICATIONS
========================================== */

let notifyTimer;

function notify(text){

  const box=
    document.getElementById("notify");

  box.textContent=text;

  box.classList.add("show");

  clearTimeout(notifyTimer);

  notifyTimer=setTimeout(()=>{

    box.classList.remove("show");

  },2500);

}


/* ==========================================
   ZQSD
   PAS DE SOURIS
========================================== */

document.addEventListener(
  "keydown",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=true;

    if(
      ["z","q","s","d"]
      .includes(e.key.toLowerCase())
    ){

      e.preventDefault();

    }

  }
);


document.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);


/* ==========================================
   PLAYER MOVEMENT
========================================== */

function movement(){

  const speed=4;

  if(keys["z"])
    playerY-=speed;

  if(keys["s"])
    playerY+=speed;

  if(keys["q"])
    playerX-=speed;

  if(keys["d"])
    playerX+=speed;


  const px=
    window.innerWidth/2+
    playerX;

  const py=
    window.innerHeight/2+
    playerY;


  document.getElementById(
    "player"
  ).style.left=px+"px";

  document.getElementById(
    "player"
  ).style.top=py+"px";


  /*
    le sol bouge pour donner
    une impression de déplacement
    sans caméra souris
  */

  document.getElementById(
    "floor"
  ).style.transform=
    `translate(${-playerX}px,${-playerY}px)`;


  requestAnimationFrame(
    movement
  );

}

movement();


/* ==========================================
   ROLL KEY
========================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key.toLowerCase()==="r" &&
      document.querySelector(
        ".popup[style*='block']"
      )===null
    ){

      rollBrainrot();

    }

  }
);


/* ==========================================
   SAVE
========================================== */

function saveGame(){

  localStorage.setItem(
    "brainrotEmpire",
    JSON.stringify({

      coins,

      inventory,

      machines,

      playerX,

      playerY

    })
  );

}


/* ==========================================
   LOAD
========================================== */

function loadGame(){

  const save=
    localStorage.getItem(
      "brainrotEmpire"
    );

  if(!save) return;

  try{

    const data=
      JSON.parse(save);

    coins=
      data.coins ?? 10000;

    inventory=
      data.inventory ?? [];

    playerX=
      data.playerX ?? 0;

    playerY=
      data.playerY ?? 0;

    if(data.machines){

      data.machines.forEach(
        (saved,i)=>{

          if(machines[i])
            machines[i].level=
              saved.level;

        }
      );

    }

  }catch(e){

    console.log(
      "Save invalide"
    );

  }

}

setInterval(
  saveGame,
  5000
);

loadGame();

calculateIncome();

updateHUD();

renderInventory();

</script>
